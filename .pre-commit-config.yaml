repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: Gitleaks staged secrets
        language: system
        entry: gitleaks git . --staged --config .gitleaks.toml --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --no-banner
        pass_filenames: false
        always_run: true
      - id: private-source-boundary
        name: Private files and identities
        language: system
        entry: python3 scripts/check_public_source.py --staged
        pass_filenames: false
        always_run: true
