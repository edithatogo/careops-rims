name: Public source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets-and-privacy:
    name: Secrets and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan history and current source
        run: |
          gitleaks git . --log-opts="--all" --config .gitleaks.toml --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --no-banner
          gitleaks dir . --config .gitleaks.toml --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --no-banner
          python3 scripts/check_public_source.py
  operator-tests:
    name: Operator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          python3 -m unittest discover -s tests -p test_rims_operator.py -v
          python3 -m unittest discover -s tests -p test_prepare_register_export_monitoring.py -v
          python3 -m unittest discover -s tests -p test_public_source_guard.py -v
          python3 -m unittest discover -s tests -p test_powerplatform_tooling.py -v
          python3 -m unittest discover -s tests -p test_prepare_archive_definition_recovery.py -v
          python3 -m unittest discover -s tests -p test_read_qgip_committed_source.py -v
          python3 -m unittest discover -s tests -p test_grants_qld_qgip_api.py -v
