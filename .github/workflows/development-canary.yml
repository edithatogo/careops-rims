name: Development compatibility canary
on:
  schedule:
    - cron: '43 18 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/development-canary.yml
permissions:
  contents: read
concurrency:
  group: development-canary-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Preview tools and RIMS compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read qualified shared candidate resolver
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          # Exact source edithatogo/careops@30df4953ea87c8915b4a525fc671a4c9857c3f7f; inherited licence retained.
          test ! -e "$GITHUB_WORKSPACE/.careops-ci-tools"
          cd "$GITHUB_WORKSPACE/.careops-security/upstream/30df4953ea87c8915b4a525fc671a4c9857c3f7f"
          sha256sum --check SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/.careops-ci-tools"
          cp -R . "$GITHUB_WORKSPACE/.careops-ci-tools/"
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        id: helper
        env:
          SELECTED_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.local/rims-canary-helper" ] || [ -L "$GITHUB_WORKSPACE/.local/rims-canary-helper" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.local/rims-canary-helper"
          "$GITHUB_WORKSPACE/.local/rims-canary-helper/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.local/rims-canary-helper'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.local/rims-canary-helper/bin" >> "$GITHUB_PATH"
      - id: bootstrap
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Resolve a separate exact hash-locked CI tool candidate
        id: resolve
        run: |
          mkdir -p .local/tool-canary
          python .careops-ci-tools/portfolio-scripts/ci_delivery.py lock --root .careops-ci-tools --preview --output .careops-ci-tools/.local/canary/requirements.lock --receipt .local/tool-canary/candidate.json
          cp .careops-ci-tools/.local/canary/requirements.lock .local/tool-canary/requirements.lock
          if [ -e .local/rims-tool-canary ] || [ -L .local/rims-tool-canary ]; then
            echo 'Refusing an existing candidate environment.' >&2
            exit 1
          fi
          uv venv --python 3.15.1 .local/rims-tool-canary
          .local/rims-tool-canary/bin/python -I - <<'PYCODE'
          import pathlib, platform, sys
          expected = pathlib.Path.cwd() / '.local/rims-tool-canary'
          if platform.python_version() != '3.15.1' or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the isolated repository-local tool candidate.')
          PYCODE
          uv pip install --python "$GITHUB_WORKSPACE/.local/rims-tool-canary/bin/python" --require-hashes --only-binary=:all: --no-binary=pyyaml -r .local/tool-canary/requirements.lock
          "$GITHUB_WORKSPACE/.local/rims-tool-canary/bin/python" -VV > .local/tool-canary/tool-python-version.txt
          python -VV > .local/tool-canary/python-version.txt
      - name: Exercise RIMS behaviour and candidate tooling
        id: qualification
        run: |
          python scripts/check_public_source.py
          python scripts/check_public_docs.py
          python -m pip install --require-hashes --only-binary=:all: -r requirements-runtime.lock
          python scripts/run_public_tests.py
          "$GITHUB_WORKSPACE/.local/rims-tool-canary/bin/ruff" check --select E9,F63,F7,F82 scripts tests
          "$GITHUB_WORKSPACE/.local/rims-tool-canary/bin/python" -m pip_audit --disable-pip --no-deps -r .local/tool-canary/requirements.lock
          "$GITHUB_WORKSPACE/.local/rims-tool-canary/bin/python" -m pip_audit --disable-pip --no-deps -r requirements-runtime.lock
          "$GITHUB_WORKSPACE/.local/rims-tool-canary/bin/zizmor" --offline --persona pedantic --format plain .github/workflows
      - name: Record actual tool qualification outcomes
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          HELPER_OUTCOME: ${{ steps.helper.outcome }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          if [ "$HELPER_OUTCOME" != success ] || [ ! -x "$GITHUB_WORKSPACE/.local/rims-canary-helper/bin/python" ]; then
            mkdir -p .local/tool-canary
            printf '%s\n' '{"state":"setup-blocked","failedStage":"helper","promoted":false,"nativeWrites":false,"reason":"verified-helper-unavailable; use run metadata for source identity"}' > .local/tool-canary/qualification.json
            exit 1
          fi
          "$GITHUB_WORKSPACE/.local/rims-canary-helper/bin/python" -I - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path('.local/tool-canary')
          root.mkdir(parents=True, exist_ok=True)
          lock = root / 'requirements.lock'
          digest = hashlib.sha256(lock.read_bytes()).hexdigest() if lock.exists() else None
          stages = {name: os.environ[name.upper() + '_OUTCOME'] for name in ['source', 'policy', 'python', 'helper', 'bootstrap', 'resolve', 'qualification']}
          failed = next((name for name, outcome in stages.items() if outcome == 'failure'), None)
          if failed in ['source', 'policy', 'python', 'helper', 'bootstrap']:
              state = 'setup-blocked'
          elif failed:
              state = 'executed-failure'
          elif 'cancelled' in stages.values():
              state = 'cancelled'
          elif all(outcome == 'success' for outcome in stages.values()):
              state = 'qualified-tool-candidate'
          else:
              state = 'not-executed'
          runtimes = {}
          try:
              candidate = json.loads((root / 'candidate.json').read_text()) if (root / 'candidate.json').exists() else {}
              for name in ['python-version', 'tool-python-version']:
                  path = root / (name + '.txt')
                  runtimes[name] = path.read_text().strip() if path.exists() else ''
              if state == 'qualified-tool-candidate' and (not digest or candidate.get('lockSha256') != digest):
                  state = 'evidence-mismatch'
              if state == 'qualified-tool-candidate' and not (runtimes['python-version'].startswith('Python 3.15.1 ') and runtimes['tool-python-version'].startswith('Python 3.15.1 ')):
                  state = 'runtime-mismatch'
          except (OSError, ValueError, TypeError):
              state = 'evidence-invalid'
          receipt = {'sourceCommit': os.environ['GITHUB_SHA'], 'stages': stages, 'failedStage': failed, 'runtimes': runtimes, 'lockSha256': digest, 'state': state, 'promoted': False, 'nativeWrites': False}
          (root / 'qualification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          if state in {'evidence-mismatch', 'runtime-mismatch', 'evidence-invalid'}:
              raise SystemExit('Canary evidence refused: ' + state)
          PYCODE
      - name: Retain candidate versions and lock without promotion
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rims-tool-candidate
          path: .local/tool-canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  runtime:
    name: Python preview discovery and RIMS compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read qualified shared runtime discovery helper
        shell: bash
        run: |
          set -euo pipefail
          # Exact source edithatogo/careops@30df4953ea87c8915b4a525fc671a4c9857c3f7f; inherited licence retained.
          test ! -e "$GITHUB_WORKSPACE/.careops-ci-tools"
          cd "$GITHUB_WORKSPACE/.careops-security/upstream/30df4953ea87c8915b4a525fc671a4c9857c3f7f"
          sha256sum --check SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/.careops-ci-tools"
          cp -R . "$GITHUB_WORKSPACE/.careops-ci-tools/"
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Select verified repository-local Python
        id: helper
        env:
          SELECTED_PYTHON: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON: '3.15.1'
        run: |
          if [ -e "$GITHUB_WORKSPACE/.local/rims-canary-helper" ] || [ -L "$GITHUB_WORKSPACE/.local/rims-canary-helper" ]; then
            echo 'Refusing a pre-existing helper environment.' >&2
            exit 1
          fi
          "$SELECTED_PYTHON" -I -m venv "$GITHUB_WORKSPACE/.local/rims-canary-helper"
          "$GITHUB_WORKSPACE/.local/rims-canary-helper/bin/python" -I - <<'PYCODE'
          import os, pathlib, platform, sys
          expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.local/rims-canary-helper'
          if sys.version_info[:2] != (3, 15) or platform.python_version() != os.environ['EXPECTED_PYTHON'] or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the selected repository-local Python 3.15 environment.')
          print(sys.version)
          print('Verified repository-local helper environment.')
          PYCODE
          echo "$GITHUB_WORKSPACE/.local/rims-canary-helper/bin" >> "$GITHUB_PATH"
      - name: Verify failed discovery retains a terminal receipt
        run: |
          probe_receipt=".local/runtime-contract-probe/discovery.json"
          python .careops-ci-tools/portfolio-scripts/ci_delivery.py runtime-finalize --receipt "$probe_receipt" --discovery-outcome failure --outcome skipped
          python - "$probe_receipt" <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt['state'] == 'discovery-failed'
          assert receipt['discoveryOutcome'] == 'failure'
          assert receipt['runtimeTestOutcome'] == 'skipped'
          assert receipt['runtimeTestsExecuted'] is False
          assert receipt['promoted'] is False
          PYTHON
      - name: Freeze manifest and discover a runnable newer preview
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/runtime-canary
          runtime_manifest_revision="$(gh api repos/actions/python-versions/commits/main --jq .sha)"
          [[ "$runtime_manifest_revision" =~ ^[a-f0-9]{40}$ ]]
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/actions/python-versions/$runtime_manifest_revision/versions-manifest.json" -o .local/runtime-canary/manifest.json
          runtime_platform="$(python -c 'import platform; print(platform.freedesktop_os_release()["VERSION_ID"])')"
          python .careops-ci-tools/portfolio-scripts/ci_delivery.py runtime --platform-version "$runtime_platform" --manifest .local/runtime-canary/manifest.json --manifest-revision "$runtime_manifest_revision" --output .local/runtime-canary/discovery.json --github-output "$GITHUB_OUTPUT"
      - name: Set up only the exact available preview
        id: preview
        if: steps.discover.outputs.available == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.discover.outputs.version }}
          allow-prereleases: true
      - name: Create and verify the isolated preview environment
        id: preview_environment
        if: steps.discover.outputs.available == 'true'
        env:
          SELECTED_PREVIEW: ${{ steps.preview.outputs.python-path }}
          EXPECTED_PREVIEW: ${{ steps.discover.outputs.version }}
        run: |
          if [ -e .local/rims-preview ] || [ -L .local/rims-preview ]; then
            echo 'Refusing an existing preview environment.' >&2
            exit 1
          fi
          "$SELECTED_PREVIEW" -I -m venv .local/rims-preview
          .local/rims-preview/bin/python -I - <<'PYCODE'
          import os, pathlib, platform, re, sys
          expected = pathlib.Path.cwd() / '.local/rims-preview'
          selected = re.sub(r'[-.]?(a|b|rc)[-.]?(\d+)$', r'\1\2', os.environ['EXPECTED_PREVIEW'])
          if sys.version_info[:2] != (3, 15) or platform.python_version() != selected or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
              raise SystemExit('Expected the exact selected isolated preview.')
          PYCODE
      - name: Exercise RIMS on the resolved Python preview
        id: runtime_tests
        if: steps.discover.outputs.available == 'true'
        run: |
          "$GITHUB_WORKSPACE/.local/rims-preview/bin/python" -VV > .local/runtime-canary/python-version.txt
          "$GITHUB_WORKSPACE/.local/rims-preview/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-runtime.lock
          "$GITHUB_WORKSPACE/.local/rims-preview/bin/python" scripts/run_public_tests.py
          "$GITHUB_WORKSPACE/.local/rims-preview/bin/python" scripts/rims_operator.py --help
      - name: Record actual qualification or explicit unavailability
        if: always()
        env:
          HELPER_OUTCOME: ${{ steps.helper.outcome }}
          DISCOVERY_OUTCOME: ${{ steps.discover.outcome }}
          RUNTIME_TEST_OUTCOME: ${{ steps.runtime_tests.outcome }}
        run: |
          if [ "$HELPER_OUTCOME" != success ] || [ ! -x "$GITHUB_WORKSPACE/.local/rims-canary-helper/bin/python" ]; then
            mkdir -p .local/runtime-canary
            printf '%s\n' '{"state":"setup-blocked","promoted":false,"nativeWrites":false,"runtimeTestsExecuted":false,"reason":"verified-helper-unavailable"}' > .local/runtime-canary/helper-failure.json
            exit 1
          fi
          "$GITHUB_WORKSPACE/.local/rims-canary-helper/bin/python" -I .careops-ci-tools/portfolio-scripts/ci_delivery.py runtime-finalize --receipt .local/runtime-canary/discovery.json --outcome "$RUNTIME_TEST_OUTCOME" --discovery-outcome "$DISCOVERY_OUTCOME"
      - name: Retain frozen manifest and actual outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rims-runtime-candidate
          path: .local/runtime-canary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
